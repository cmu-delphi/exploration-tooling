covid_hosp_explore:
  script: pipelines/covid_hosp_explore.R
  store: covid_hosp_explore
  use_crew: yes
  reporter_make: timestamp
flu_hosp_explore:
  script: pipelines/flu_hosp_explore.R
  store: flu_hosp_explore
  use_crew: yes
  reporter_make: timestamp
flu_hosp_prod:
  script: pipelines/flu_hosp_prod.R
  store: flu_hosp_prod
  use_crew: yes
  reporter_make: timestamp
flu_hosp_evaluation:
  # Same script as flu_hosp_prod; it dispatches on the project name. Separate
  # store so evaluation runs don't invalidate the production cache.
  script: pipelines/flu_hosp_prod.R
  store: flu_hosp_evaluation
  use_crew: yes
  reporter_make: timestamp
covid_hosp_prod:
  script: pipelines/covid_hosp_prod.R
  store: covid_hosp_prod
  use_crew: yes
  reporter_make: timestamp
covid_hosp_evaluation:
  # Same script as covid_hosp_prod; it dispatches on the project name. Separate
  # store so evaluation runs don't invalidate the production cache.
  script: pipelines/covid_hosp_prod.R
  store: covid_hosp_evaluation
  use_crew: yes
  reporter_make: timestamp
flu_hosp_prod_regr:
  # Regression project: same script as flu_hosp_prod, separate store.
  # Dispatches as evaluation mode, defaulting to 1 date. Use when prod ran on
  # its nominal Wednesday (generation_date == forecast_date).
  # Usage: FORECAST_REFERENCE_DATE=<last-prod-wednesday> TAR_RUN_PROJECT=flu_hosp_prod_regr \
  #          Rscript scripts/oracle/capture.R
  script: pipelines/flu_hosp_prod.R
  store: flu_hosp_prod_regr
  use_crew: yes
  reporter_make: timestamp
flu_hosp_prod_regr_prod:
  # Regression project: runs in prod mode so generation_date == FORECAST_REFERENCE_DATE.
  # Use when prod ran on a non-Wednesday (delayed run): set FORECAST_REFERENCE_DATE to
  # the actual run date; generation_date=run_date, forecast_date=nearest Wednesday.
  # Usage: FORECAST_REFERENCE_DATE=<actual-run-date> ORACLE_LABEL=refactored \
  #          TAR_RUN_PROJECT=flu_hosp_prod_regr_prod Rscript scripts/oracle/capture.R
  script: pipelines/flu_hosp_prod.R
  store: flu_hosp_prod_regr_prod
  use_crew: yes
  reporter_make: timestamp
covid_hosp_prod_regr:
  # Regression project: same script as covid_hosp_prod, separate store.
  # Runs in evaluation mode (dispatches on project name). Use when the prod run
  # happened on its nominal Wednesday (generation_date == forecast_date).
  # Usage: FORECAST_REFERENCE_DATE=<last-prod-wednesday> TAR_RUN_PROJECT=covid_hosp_prod_regr \
  #          Rscript scripts/oracle/capture.R
  script: pipelines/covid_hosp_prod.R
  store: covid_hosp_prod_regr
  use_crew: yes
  reporter_make: timestamp
covid_hosp_prod_regr_prod:
  # Regression project: runs in prod mode (not evaluation mode) so that
  # generation_date == FORECAST_REFERENCE_DATE (not snapped to weekly schedule).
  # Use when prod ran on a non-Wednesday (delayed run): set FORECAST_REFERENCE_DATE
  # to the actual run date, which gives generation_date=run_date and
  # forecast_date=round_date(run_date, "weeks", week_start=3).
  # Usage: FORECAST_REFERENCE_DATE=<actual-run-date> ORACLE_LABEL=refactored \
  #          TAR_RUN_PROJECT=covid_hosp_prod_regr_prod Rscript scripts/oracle/capture.R
  script: pipelines/covid_hosp_prod.R
  store: covid_hosp_prod_regr_prod
  use_crew: yes
  reporter_make: timestamp
rsv_hosp_prod:
  script: pipelines/rsv_hosp_prod.R
  store: rsv_hosp_prod
  use_crew: yes
  reporter_make: timestamp
